{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="eyebrow">ADMINISTRAÇÃO</span><h1>{{ 'Editar corrida' if event else 'Nova corrida' }}</h1></div></div><form method="post" class="card form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% set src=form if form else event %}<label>Data<input type="date" name="event_date" value="{{ src.event_date or '' }}" required></label><label>Nome<input name="name" value="{{ src.name or '' }}" maxlength="120" required></label><label>Cidade<input name="city" value="{{ src.city or '' }}" required></label><label>Estado<input name="state" value="{{ src.state or '' }}" maxlength="2" required></label><label>Link de inscrição<input type="url" name="registration_url" value="{{ src.registration_url or '' }}"></label><label>Link das fotos<input type="url" name="photos_url" value="{{ src.photos_url or '' }}"></label><label>Status<select name="status"><option value="publicado" {% if src.status=='publicado' %}selected{% endif %}>Publicado</option><option value="rascunho" {% if src.status=='rascunho' %}selected{% endif %}>Rascunho</option></select></label><div class="form-actions"><button class="btn primary">Salvar</button><a class="btn" href="{{ url_for('admin') }}">Cancelar</a></div></form>{% endblock %}
