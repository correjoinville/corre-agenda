services:
  - type: web
    name: corre-agenda
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app init-db && gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: FLASK_ENV
        value: production
